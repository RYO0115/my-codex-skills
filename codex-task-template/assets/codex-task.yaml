# =============================================================
# Codexへの作業指示テンプレート（YAML）
# =============================================================
# 使い方:
#   1. このファイルをworkspaceへコピーし、task.yamlなどの名前で編集する。
#   2. Codexへ「task.yamlを読んで実行して」と依頼する。
#   3. 不要な任意項目は削除し、空欄や例文を残さない。
#
# 必須項目はgoal / context / deliverables。acceptanceには、Codexが完了を
# 機械的に判断できるコマンドまたは観測可能な結果を書く。
# =============================================================

goal: >
  一文で達成したい結果を書く。issue起因なら番号も含める。

context: >
  背景、経緯、困っていることなど、workspaceから読み取れない情報だけを書く。

deliverables:
  - 成果物をファイルパスや形式まで具体的に書く

# --- 任意（不要な項目は削除） -------------------------------

inputs:
  - 参照するURL、ファイル、過去の成果物

scope:
  include:
    - 触ってよいディレクトリやシステム
  exclude:
    - 触ってはいけないディレクトリやシステム

constraints:
  - 適用する技術、互換性、文体、性能などの条件
  - 実装途中に作成した、成果物に不要なファイルは残さない
  - 機能を変更したら、対応するテストとドキュメントも更新する

do_not:
  - 編集不要なファイルを変更しない
  - 明示したscopeを確認なく拡大しない

acceptance:
  - プロジェクト既定のテストラッパーで全テストが成功する
  - プロジェクト既定の静的解析が警告なしで成功する
  - deliverablesがすべて存在し、プレースホルダーが残っていない

process:
  ask_when_unsure: true
  confirm_before:
    - 外部サービスへの書き込み
    - 破壊的または復元困難な操作
    - 課金を伴う操作
    - scopeの実質的な拡大
  steps:
    - 現状と既存規約を確認する
    - 実装して必要な検証を行う
    - 差分をレビューし、結果を報告する

output:
  language: ja
  format: 変更点、検証結果、残っている注意点を簡潔に報告
